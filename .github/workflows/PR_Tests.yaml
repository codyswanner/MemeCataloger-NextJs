name: Pull Request Automated Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12]
        node-version: [22.x]
    
    steps:
    - uses: actions/checkout@v7
    - name: Initialize Secrets
      run: |
        printf '%s' '${{ secrets.DJANGO_DB_PW }}' >> django-db-pw.txt
        printf '%s' '${{ secrets.DB_PW }}' >> db-pw.txt
    - name: Set up containers
      run: |
        docker compose up -d; echo "Checking MySQL health status..."
          attempt_counter=0
          max_attempts=24
          until [ "$(docker inspect --format="{{.State.Health.Status}}" memecataloger-nextjs-db-1)" == "healthy" ]; do
            if [ ${attempt_counter} -eq ${max_attempts} ];then
              echo "Max attempts reached"
              exit 1
            fi

            health_status=$(docker inspect --format="{{.State.Health.Status}}" memecataloger-nextjs-db-1)
            echo "Current MySQL health status: ${health_status}"

            if [ "${health_status}" != "healthy" ]; then
              echo "Displaying last 10 lines from Docker logs:"
              docker logs --tail 10 my_container
            fi

            attempt_counter=$(($attempt_counter+1))
            sleep 5
          done
    - name: Install npm dependencies
      run: docker exec memecataloger-nextjs-frontend-1 npm install
    - name: Ruff Linter
      run: |
        docker exec memecataloger-nextjs-backend-1 python -m ruff check
    - name: Run Backend Tests
      run: |
        docker exec memecataloger-nextjs-backend-1 python manage.py test
    - name: ESLint
      run: docker exec memecataloger-nextjs-frontend-1 npx next lint
    - name: Run Jest Tests
      run: |
        docker exec memecataloger-nextjs-frontend-1 npm run test:gh-actions
    - name: Build for E2E Testing
      run: docker exec memecataloger-nextjs-frontend-1 npx next build
    - name: Run Playwright E2E Tests
      run: docker exec memecataloger-nextjs-frontend-1 npx playwright test
